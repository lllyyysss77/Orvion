name: Docker 镜像构建

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: 计算版本并打 Git Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算递增版本（x.y.9 -> x.(y+1).0；x.9.9 -> (x+1).0.0）
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            major=0
            minor=0
            patch=0
          else
            major=$(echo "$latest" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
            minor=$(echo "$latest" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
            patch=$(echo "$latest" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')

            if [ -z "${major:-}" ] || [ -z "${minor:-}" ] || [ -z "${patch:-}" ]; then
              major=0
              minor=0
              patch=0
            fi
          fi

          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then
            patch=0
            minor=$((minor + 1))
            if [ "$minor" -ge 10 ]; then
              minor=0
              major=$((major + 1))
            fi
          fi

          version="${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: 计算镜像名
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"

      - name: 推送版本标签（Git Tag）
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          git fetch --tags --force
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "tag $tag 已存在于远端，跳过"
            exit 0
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag 已存在，跳过"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

  build:
    name: 构建 ${{ matrix.arch }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.arch }} 单架构临时镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ needs.version.outputs.image }}:build-${{ matrix.arch }}-${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=registry,ref=${{ needs.version.outputs.image }}:cache-${{ matrix.arch }}
          cache-to: |
            type=gha,scope=${{ matrix.arch }},mode=max
            type=registry,ref=${{ needs.version.outputs.image }}:cache-${{ matrix.arch }},mode=max

  manifest:
    name: 合并多架构镜像（同一个 tag：version + latest）
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成并推送 manifest
        run: |
          set -euo pipefail
          IMAGE="${{ needs.version.outputs.image }}"
          VERSION="${{ needs.version.outputs.version }}"
          AMD="$IMAGE:build-amd64-${{ github.sha }}"
          ARM="$IMAGE:build-arm64-${{ github.sha }}"

          docker buildx imagetools create -t "$IMAGE:$VERSION" "$AMD" "$ARM"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$AMD" "$ARM"
          fi

      - name: （可选）查看 latest manifest
        run: docker buildx imagetools inspect ${{ needs.version.outputs.image }}:latest || true
